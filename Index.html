<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Financial Tools & Calculators</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#14213d;--mu:#667085;--bd:#e3e8ef;--pr:#0a7cff;--pl:#e6f3ff;--ok:#12b76a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1420;--card:#16202e;--tx:#e8eef7;--mu:#98a4b8;--bd:#263246;--pl:#12304f}}
:root[data-theme=dark]{--bg:#0d1420;--card:#16202e;--tx:#e8eef7;--mu:#98a4b8;--bd:#263246;--pl:#12304f}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,#0a7cff,#5b3df5);color:#fff;padding:28px 16px 40px;text-align:center}
header h1{margin:0 0 6px;font-size:1.6rem}header p{margin:0;opacity:.9;font-size:.95rem}
.top{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px)}
button{font:inherit;cursor:pointer}.ib{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:6px 10px}
.wrap{max-width:1100px;margin:-24px auto 40px;padding:0 14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tools input{flex:1;min-width:180px;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;transition:.15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(10,124,255,.15)}
.ic{width:54px;height:54px;border-radius:14px;background:var(--pl);display:grid;place-items:center;font-size:1.6rem}
.card h3{margin:0;font-size:1rem}.card p{margin:0;color:var(--mu);font-size:.8rem;flex:1}
.go{border:1.5px solid var(--pr);color:var(--pr);background:none;border-radius:16px;padding:3px 14px;font-size:.8rem}
.empty{text-align:center;color:var(--mu);padding:40px}
#view{display:none;position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:5;padding-top:env(safe-area-inset-top,0px)}
.vh{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:2}
.vh h2{margin:0;font-size:1.1rem;flex:1}.vh button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:6px 12px}
.vb{max-width:1100px;margin:0 auto;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px}
@media(max-width:800px){.vb{grid-template-columns:1fr}}
.pn{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.fl{margin-bottom:16px}.fl label{display:flex;justify-content:space-between;align-items:center;font-size:.88rem;margin-bottom:6px;color:var(--mu)}
.fl input[type=number],.fl select{width:120px;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;text-align:right}
.fl input[type=range]{width:100%;accent-color:var(--pr)}
.big{text-align:center;padding:14px;background:var(--pl);border-radius:10px;margin-bottom:12px}
.big small{color:var(--mu);display:block}.big b{font-size:1.8rem;color:var(--pr)}
.rw{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:.92rem}.rw b{text-align:right}
.pie{display:flex;align-items:center;gap:16px;margin:14px 0;flex-wrap:wrap}.donut{width:110px;height:110px;border-radius:50%;flex:none}
.lg div{font-size:.85rem;margin:3px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
svg.ch{width:100%;height:auto;margin-top:6px}
.tw{max-height:260px;overflow:auto;margin-top:8px}table{width:100%;border-collapse:collapse;font-size:.82rem}th,td{padding:6px;text-align:right;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:var(--card)}
.note{color:var(--mu);font-size:.78rem;margin-top:10px}
.act{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.act button{flex:1;border:1px solid var(--pr);background:none;color:var(--pr);border-radius:8px;padding:8px}
.rec{margin:20px 0 6px;font-size:.9rem;color:var(--mu)}
</style></head><body>
<header><div class="top"><button class="ib" id="hb">❓ How to use</button> <button class="ib" id="th">🌓</button></div><h1>Financial Tools &amp; Calculators</h1><p>24 free calculators for investing, loans, tax &amp; retirement planning</p></header>
<div class="wrap"><div class="tools"><input id="q" placeholder="Search calculators…" aria-label="Search"></div><div class="tools" id="cats"></div><div class="rec" id="rec"></div><div class="grid" id="grid"></div></div>
<div id="view"><div class="vh"><button id="bk">← Back</button><h2 id="vt"></h2></div><div class="vb"><div class="pn" id="inp"></div><div class="pn" id="out"></div></div></div>
<div id="hw" style="display:none;position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.5);overflow:auto;padding:20px 12px"><div class="pn" style="max-width:640px;margin:auto"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">❓ How to use</h2><button id="hx" class="chip">✕ Close</button></div><div class="tools" id="hl" style="margin:12px 0"></div><ol id="ht" style="line-height:1.8;padding-left:22px"></ol></div></div>
<script>
const R=n=>'₹'+Math.round(isFinite(n)?n:0).toLocaleString('en-IN');
const P=n=>(isFinite(n)?n:0).toFixed(2)+'%';
const N=(l,k,v,mn,mx,st,u)=>({l,k,v,mn,mx,st,u});
const S=(l,k,v,o)=>({l,k,v,o,t:'s'});
function sipRun(p,r,y,lump,step){let i=r/1200,b=lump,inv=lump,ser=[];for(let m=1;m<=y*12;m++){b=(b+p)*(1+i);inv+=p;if(m%12==0)ser.push([m/12,inv,b])}return{b,inv,ser}}
function grow(inv,b,ser){return{main:['Maturity value',R(b)],rows:[['Invested amount',R(inv)],['Estimated returns',R(b-inv)],['Wealth gain',inv>0?P((b/inv-1)*100):'-']],pie:[inv,b-inv,'Invested','Returns'],ser,sl:['Invested','Value']}}
function amort(p,r,n,ex){const i=r/1200,e=i?p*i*Math.pow(1+i,n)/(Math.pow(1+i,n)-1):p/n;let bal=p,ti=0,m=0,ser=[];while(bal>0.5&&m<n+600){m++;const it=bal*i;let pr=Math.min(e-it+ex,bal);if(pr<=0)break;bal-=pr;ti+=it;if(m%12==0||bal<=0.5)ser.push([Math.ceil(m/12),ti,Math.max(bal,0)])}return{e,ti,m,ser}}
function loan(v){const a=amort(v.p,v.r,v.y*12,v.x||0),base=amort(v.p,v.r,v.y*12,0);const rows=[['Principal',R(v.p)],['Total interest',R(a.ti)],['Total payment',R(v.p+a.ti)],['Loan tenure',Math.floor(a.m/12)+' yrs '+a.m%12+' mo']];if(v.x>0)rows.push(['Interest saved',R(base.ti-a.ti)],['Months saved',(base.m-a.m)+'']);return{main:['Monthly EMI',R(a.e+0)],rows,pie:[v.p,a.ti,'Principal','Interest'],ser:a.ser,sl:['Interest paid','Balance']}}
const LF=(p,r,y)=>[N('Loan amount (₹)','p',p,10000,50000000,10000,'₹'),N('Interest rate (% p.a.)','r',r,1,30,.1,'%'),N('Tenure (years)','y',y,1,30,1,'yrs'),N('Extra monthly prepayment (₹)','x',0,0,500000,500,'₹')];
const C=[
{n:'SIP Calculator',ic:'💰',c:'Invest',d:'Find the future value of your Systematic Investment Plan with our fairly accurate SIP return calculator.',f:[N('Monthly investment (₹)','p',10000,500,1000000,500,'₹'),N('Expected return (% p.a.)','r',12,1,30,.5,'%'),N('Time period (years)','y',10,1,40,1,'yrs'),N('Annual step-up (%)','s',0,0,25,1,'%')],run:v=>{let b=0,inv=0,ser=[],p=v.p,i=v.r/1200;for(let y=1;y<=v.y;y++){for(let m=0;m<12;m++){b=(b+p)*(1+i);inv+=p}ser.push([y,inv,b]);p*=1+v.s/100}return grow(inv,b,ser)}},
{n:'Mutual Fund Calculator',ic:'🔒',c:'Invest',d:'A reliable tool to help you calculate your mutual fund investments (lumpsum + SIP).',f:[N('Lumpsum (₹)','l',100000,0,50000000,5000,'₹'),N('Monthly SIP (₹)','p',5000,0,1000000,500,'₹'),N('Expected return (% p.a.)','r',12,1,30,.5,'%'),N('Period (years)','y',10,1,40,1,'yrs')],run:v=>{const o=sipRun(v.p,v.r,v.y,v.l);return grow(o.inv,o.b,o.ser)}},
{n:'CAGR Calculator',ic:'📈',c:'Invest',d:'Calculate the compound annual growth rate for your investment with the CAGR calculator.',f:[N('Initial value (₹)','i',100000,1,100000000,1000,'₹'),N('Final value (₹)','e',250000,1,1000000000,1000,'₹'),N('Duration (years)','y',5,1,50,.5,'yrs')],run:v=>{const c=Math.pow(v.e/v.i,1/v.y)-1;return{main:['CAGR',P(c*100)],rows:[['Initial value',R(v.i)],['Final value',R(v.e)],['Absolute return',P((v.e/v.i-1)*100)],['Total gain',R(v.e-v.i)]],pie:[v.i,Math.max(v.e-v.i,0),'Initial','Gain'],ser:Array.from({length:Math.ceil(v.y)},(_,k)=>[k+1,v.i,v.i*Math.pow(1+c,k+1)]),sl:['Initial','Value']}}},
{n:'Lumpsum Calculator',ic:'👛',c:'Invest',d:'Got a lump sum to invest? Find out the estimated returns on your lumpsum MF investment for the entire period.',f:[N('Investment (₹)','p',500000,1000,100000000,5000,'₹'),N('Expected return (% p.a.)','r',12,1,30,.5,'%'),N('Period (years)','y',10,1,40,1,'yrs')],run:v=>{const ser=[];for(let y=1;y<=v.y;y++)ser.push([y,v.p,v.p*Math.pow(1+v.r/100,y)]);return grow(v.p,v.p*Math.pow(1+v.r/100,v.y),ser)}},
{n:'PPF Calculator',ic:'🤝',c:'Govt Schemes',d:'Determine your savings and interest earnings with our Public Provident Fund calculator.',f:[N('Yearly deposit (₹, max 1.5L)','p',150000,500,150000,500,'₹'),N('Interest rate (% p.a.)','r',7.1,5,10,.1,'%'),N('Duration (years, min 15)','y',15,15,50,1,'yrs')],run:v=>{let b=0,ser=[];for(let y=1;y<=v.y;y++){b=(b+v.p)*(1+v.r/100);ser.push([y,v.p*y,b])}return grow(v.p*v.y,b,ser)}},
{n:'FD Calculator',ic:'🏦',c:'Deposits',d:'Easily calculate your returns and maturity amount with a fixed deposit calculator.',f:[N('Deposit (₹)','p',500000,1000,100000000,5000,'₹'),N('Interest rate (% p.a.)','r',7,1,15,.1,'%'),N('Tenure (years)','y',5,1,30,1,'yrs'),S('Compounding','q',4,[[1,'Yearly'],[2,'Half-yearly'],[4,'Quarterly'],[12,'Monthly']])],run:v=>{const f=y=>v.p*Math.pow(1+v.r/(100*v.q),v.q*y);const ser=[];for(let y=1;y<=v.y;y++)ser.push([y,v.p,f(y)]);return grow(v.p,f(v.y),ser)}},
{n:'RD Calculator',ic:'📅',c:'Deposits',d:'Plan your savings with precision using a recurring deposit calculator.',f:[N('Monthly deposit (₹)','p',10000,100,1000000,100,'₹'),N('Interest rate (% p.a.)','r',6.8,1,15,.1,'%'),N('Tenure (years)','y',5,1,15,1,'yrs')],run:v=>{const n=v.y*12,ser=[];let tot=0;for(let k=1;k<=n;k++)tot+=v.p*Math.pow(1+v.r/400,4*(n-k+1)/12);for(let y=1;y<=v.y;y++){let t=0;for(let k=1;k<=y*12;k++)t+=v.p*Math.pow(1+v.r/400,4*(y*12-k+1)/12);ser.push([y,v.p*y*12,t])}return grow(v.p*n,tot,ser)}},
{n:'NPS Calculator',ic:'🪑',c:'Retire',d:'Plan and calculate your monthly pension income with the NPS calculator.',f:[N('Monthly contribution (₹)','p',5000,500,500000,500,'₹'),N('Current age','a',30,18,59,1,'yrs'),N('Expected return (% p.a.)','r',10,5,14,.5,'%'),N('Annuity purchase (% of corpus, min 40)','n',40,40,100,5,'%'),N('Annuity rate (% p.a.)','z',6,4,9,.5,'%')],run:v=>{const y=60-v.a,o=sipRun(v.p,v.r,y,0),an=o.b*v.n/100,pen=an*v.z/1200;const g=grow(o.inv,o.b,o.ser);g.main=['Monthly pension',R(pen)];g.rows=[['Total corpus at 60',R(o.b)],['Invested',R(o.inv)],['Annuity corpus',R(an)],['Lumpsum withdrawal',R(o.b-an)]];return g}},
{n:'SSY Calculator',ic:'👧',c:'Govt Schemes',d:'Maximise returns and plan your investments with a Sukanya Samriddhi Yojana calculator.',f:[N('Yearly deposit (₹, max 1.5L)','p',100000,250,150000,250,'₹'),N('Interest rate (% p.a.)','r',8.2,5,10,.1,'%')],run:v=>{let b=0,ser=[];for(let y=1;y<=21;y++){if(y<=15)b+=v.p;b*=1+v.r/100;ser.push([y,v.p*Math.min(y,15),b])}return grow(v.p*15,b,ser)}},
{n:'EPF Calculator',ic:'👝',c:'Retire',d:'Easily find the maturity amount and interest earned on your Employee Provident Fund.',f:[N('Monthly basic + DA (₹)','b',30000,1000,500000,1000,'₹'),N('Current age','a',28,18,57,1,'yrs'),N('Retirement age','e',58,40,70,1,'yrs'),N('Current EPF balance (₹)','c',0,0,50000000,10000,'₹'),N('Salary growth (% p.a.)','g',6,0,20,.5,'%'),N('EPF rate (% p.a.)','r',8.25,5,10,.05,'%')],run:v=>{const y=Math.max(v.e-v.a,1);let b=v.c,inv=v.c,s=v.b,ser=[];for(let k=1;k<=y;k++){const c=s*(.12+.0367)*12;b=(b+c)*(1+v.r/100);inv+=c;s*=1+v.g/100;ser.push([k,inv,b])}const o=grow(inv,b,ser);o.note='Employee 12% + employer 3.67% credited to EPF (8.33% goes to EPS).';return o}},
{n:'Compound Interest Calculator',ic:'📊',c:'Invest',d:'Calculate the growth of your investment with ease using compound interest.',f:[N('Principal (₹)','p',100000,1000,100000000,1000,'₹'),N('Interest rate (% p.a.)','r',8,.5,30,.1,'%'),N('Time (years)','y',10,1,50,1,'yrs'),S('Compounding','q',1,[[1,'Yearly'],[2,'Half-yearly'],[4,'Quarterly'],[12,'Monthly'],[365,'Daily']])],run:v=>{const f=y=>v.p*Math.pow(1+v.r/(100*v.q),v.q*y),ser=[];for(let y=1;y<=v.y;y++)ser.push([y,v.p,f(y)]);return grow(v.p,f(v.y),ser)}},
{n:'APY Calculator',ic:'📜',c:'Govt Schemes',d:'Maximise returns with the Atal Pension Yojana calculator (estimate).',f:[N('Current age (18-40)','a',25,18,40,1,'yrs'),S('Monthly pension at 60','pn',5000,[[1000,'₹1,000'],[2000,'₹2,000'],[3000,'₹3,000'],[4000,'₹4,000'],[5000,'₹5,000']])],run:v=>{const corp=v.pn*170,y=60-v.a,i=.08/12,n=y*12,c=corp/(((Math.pow(1+i,n)-1)/i)*(1+i));const o=grow(c*n,corp,Array.from({length:y},(_,k)=>[k+1,c*12*(k+1),c*((Math.pow(1+i,12*(k+1))-1)/i)*(1+i)]));o.main=['Est. monthly contribution',R(c)];o.rows=[['Guaranteed pension',R(v.pn)+'/mo'],['Corpus to nominee',R(corp)],['Years of contribution',y+'']];o.note='Estimate assuming 8% growth. Official APY contribution chart set by PFRDA may differ.';return o}},
{n:'Retirement Calculator',ic:'🛋️',c:'Retire',d:'Plan a financially secure retirement with the Retirement Calculator.',f:[N('Current age','a',30,18,70,1,'yrs'),N('Retirement age','e',60,40,75,1,'yrs'),N('Life expectancy','l',85,60,100,1,'yrs'),N('Monthly expenses today (₹)','m',50000,5000,1000000,1000,'₹'),N('Inflation (% p.a.)','i',6,2,12,.5,'%'),N('Return before retirement (%)','r',11,4,18,.5,'%'),N('Return after retirement (%)','q',7,3,12,.5,'%'),N('Current savings (₹)','c',500000,0,100000000,10000,'₹')],run:v=>{const yb=Math.max(v.e-v.a,1),yr=Math.max(v.l-v.e,1),ex=v.m*12*Math.pow(1+v.i/100,yb),rr=(1+v.q/100)/(1+v.i/100)-1,corp=Math.abs(rr)<1e-9?ex*yr:ex*(1-Math.pow(1+rr,-yr))/rr*(1+rr),have=v.c*Math.pow(1+v.r/100,yb),gap=Math.max(corp-have,0),i=v.r/1200,n=yb*12,sip=gap/(((Math.pow(1+i,n)-1)/i)*(1+i));return{main:['Corpus needed',R(corp)],rows:[['Monthly expense at retirement',R(ex/12)],['Savings will grow to',R(have)],['Shortfall',R(gap)],['Required monthly SIP',R(sip)]],pie:[Math.min(have,corp),gap,'Covered by savings','Shortfall'],ser:[]}}},
{n:'SWP Calculator',ic:'🐷',c:'Invest',d:'Find the optimal systematic withdrawal amount and duration for your mutual funds.',f:[N('Total investment (₹)','p',2000000,10000,500000000,10000,'₹'),N('Monthly withdrawal (₹)','w',15000,500,5000000,500,'₹'),N('Expected return (% p.a.)','r',8,1,20,.5,'%'),N('Period (years)','y',15,1,40,1,'yrs')],run:v=>{let b=v.p,tw=0,ser=[],i=v.r/1200,m=0;for(;m<v.y*12&&b>0;m++){b*=1+i;const w=Math.min(v.w,b);b-=w;tw+=w;if((m+1)%12==0)ser.push([(m+1)/12,tw,b])}const dep=b<=0.5;return{main:['Final value',R(b)],rows:[['Total invested',R(v.p)],['Total withdrawn',R(tw)],['Money lasts',dep?Math.floor(m/12)+' yrs '+m%12+' mo (depleted)':'Full '+v.y+' yrs']],pie:[v.p,Math.max(tw-v.p+b,0),'Invested','Net gain'],ser,sl:['Withdrawn','Balance']}}},
{n:'Simple Interest Calculator',ic:'🪙',c:'Invest',d:'Compute the interest earned or payable on a loan or investment based on principal, rate and time.',f:[N('Principal (₹)','p',100000,1000,100000000,1000,'₹'),N('Rate (% p.a.)','r',8,.5,30,.1,'%'),N('Time (years)','y',5,.5,50,.5,'yrs')],run:v=>{const i=v.p*v.r*v.y/100,ser=[];for(let y=1;y<=Math.ceil(v.y);y++)ser.push([y,v.p,v.p+v.p*v.r*Math.min(y,v.y)/100]);return grow(v.p,v.p+i,ser)}},
{n:'EMI Calculator',ic:'🗓️',c:'Loans',d:'Calculate the amount you need to save and how much your SIP will accumulate.',f:LF(1000000,9,5),run:loan},
{n:'Home Loan Calculator',ic:'🏠',c:'Loans',d:'Calculate the amount of your home loan EMI.',f:LF(5000000,8.5,20),run:loan},
{n:'Education Loan EMI Calculator',ic:'🎓',c:'Loans',d:'Calculate the EMI on your Education Loan.',f:LF(1500000,9.5,10),run:loan},
{n:'Personal Loan Calculator',ic:'₹',c:'Loans',d:'Calculate your EMI for your personal loan.',f:LF(500000,12,4),run:loan},
{n:'Car Loan Calculator',ic:'🚗',c:'Loans',d:'Calculate the EMI on your car loan.',f:LF(800000,9,5),run:loan},
{n:'Income Tax Calculator',ic:'🧾',c:'Tax',d:'Calculate your income tax liability based on your income with ease (FY 2025-26 estimate).',f:[N('Annual gross salary (₹)','g',1500000,0,100000000,10000,'₹'),S('Tax regime','rg',1,[[1,'New regime'],[2,'Old regime']]),N('Deductions – 80C, 80D, HRA etc. (old regime ₹)','d',150000,0,3000000,5000,'₹')],run:v=>{const nw=v.rg==1,ti=Math.max(v.g-(nw?75000:50000)-(nw?0:v.d),0),sl=nw?[[400000,0],[800000,.05],[1200000,.1],[1600000,.15],[2000000,.2],[2400000,.25],[Infinity,.3]]:[[250000,0],[500000,.05],[1000000,.2],[Infinity,.3]];let t=0,lo=0;for(const[hi,r]of sl){if(ti>lo)t+=(Math.min(ti,hi)-lo)*r;lo=hi}if(ti<=(nw?1200000:500000))t=0;const cess=t*.04,tot=t+cess;return{main:['Total tax',R(tot)],rows:[['Taxable income',R(ti)],['Tax on slabs',R(t)],['Health & edu cess (4%)',R(cess)],['Effective rate',P(v.g?tot/v.g*100:0)],['Monthly take-home (approx)',R((v.g-tot)/12)]],pie:[v.g-tot,tot,'Take-home','Tax'],ser:[],note:'Estimate only; surcharge & marginal relief not included. Verify with latest Finance Act.'}}},
{n:'Gratuity Calculator',ic:'💵',c:'Tax',d:'Calculate gratuity payout based on years of service and salary with Payment of Gratuity Act.',f:[N('Last drawn basic + DA (₹/month)','s',50000,1000,1000000,1000,'₹'),N('Years of service (min 5)','y',10,1,45,1,'yrs')],run:v=>{const g=v.s*15/26*v.y,cap=Math.min(g,2000000);return{main:['Gratuity payable',R(cap)],rows:[['Formula amount',R(g)],['Tax-free limit (₹20L)',R(Math.min(g,2000000))],['Eligible',v.y>=5?'Yes':'No (needs 5 yrs)']],pie:[cap,0,'Gratuity',''],ser:[]}}},

ml:['മലയാളം','ltr','ഗ്രിഡിൽ നിന്ന് കാൽക്കുലേറ്റർ തിരഞ്ഞെടുക്കുക അല്ലെങ്കിൽ തിരയുക.','സ്ലൈഡർ ഉപയോഗിച്ചോ ടൈപ്പ് ചെയ്തോ തുക, പലിശ നിരക്ക്, കാലയളവ് നൽകുക.','ഫലം ഉടൻ കാണാം — ചാർട്ടും വർഷം തിരിച്ചുള്ള പട്ടികയും കാണുക.','"Copy summary" അല്ലെങ്കിൽ "Print" ഉപയോഗിച്ച് ഫലം സൂക്ഷിക്കുക. IFSC-ക്ക് 11 അക്ഷര കോഡ് നൽകുക.'],
pa:['ਪੰਜਾਬੀ','ltr','ਗ੍ਰਿਡ ਵਿੱਚੋਂ ਕੈਲਕੁਲੇਟਰ ਚੁਣੋ ਜਾਂ ਖੋਜੋ।','ਸਲਾਈਡਰ ਜਾਂ ਟਾਈਪ ਕਰਕੇ ਰਕਮ, ਵਿਆਜ ਦਰ ਅਤੇ ਮਿਆਦ ਭਰੋ।','ਨਤੀਜਾ ਤੁਰੰਤ ਦਿਸਦਾ ਹੈ — ਚਾਰਟ ਅਤੇ ਸਾਲ-ਵਾਰ ਸਾਰਣੀ ਵੇਖੋ।','"Copy summary" ਜਾਂ "Print" ਨਾਲ ਨਤੀਜਾ ਸੰਭਾਲੋ। IFSC ਲਈ 11 ਅੱਖਰਾਂ ਦਾ ਕੋਡ ਪਾਓ।'],
or:['ଓଡ଼ିଆ','ltr','ଗ୍ରିଡରୁ କ୍ୟାଲକୁଲେଟର ବାଛନ୍ତୁ କିମ୍ବା ଖୋଜନ୍ତୁ।','ସ୍ଲାଇଡର କିମ୍ବା ଟାଇପ୍ କରି ପରିମାଣ, ସୁଧ ହାର ଓ ସମୟ ଦିଅନ୍ତୁ।','ଫଳାଫଳ ତୁରନ୍ତ ଦେଖାଯାଏ — ଚାର୍ଟ ଓ ବର୍ଷ ଅନୁସାରେ ଟେବୁଲ୍ ଦେଖନ୍ତୁ।','"Copy summary" କିମ୍ବା "Print" ଦ୍ୱାରା ଫଳାଫଳ ସଞ୍ଚୟ କରନ୍ତୁ। IFSC ପାଇଁ 11 ଅକ୍ଷରର କୋଡ୍ ଦିଅନ୍ତୁ।']};
function hw(l){$('hl').innerHTML=Object.keys(HT).map(k=>'<button class="chip '+(k==l?'on':'')+'" data-l="'+k+'">'+HT[k][0]+'</button>').join('');const t=HT[l];$('ht').dir=t[1];$('ht').innerHTML=t.slice(2).map(s=>'<li>'+s+'</li>').join('')}
$('hb').onclick=()=>{hw('en');$('hw').style.display='block'};$('hx').onclick=()=>$('hw').style.display='none';
$('hl').onclick=e=>{if(e.target.dataset.l)hw(e.target.dataset.l)};
const IE=s=>String(s==null?'':s).replace(/[<>&"]/g,'');
async function ifscGo(v,d0){$('out').innerHTML='<div class="empty">Looking up '+v+'…</div>';let d=d0||null;
if(!d)try{const c=new AbortController(),t=setTimeout(()=>c.abort(),6000);const r=await fetch('https://ifsc.razorpay.com/'+v,{signal:c.signal});clearTimeout(t);if(r.status==404){$('out').innerHTML='<div class="empty">❌ No branch found for <b>'+v+'</b>. Please re-check the code.</div>';return}if(r.ok)d=await r.json()}catch(e){}
let rows,on=!!(d&&d.BRANCH);
if(on)rows=[['IFSC Code',d.IFSC||v],['Bank',d.BANK],['Branch',d.BRANCH],['Address',d.ADDRESS],['City',d.CITY],['District',d.DISTRICT],['State',d.STATE],['MICR',d.MICR],['Contact',d.CONTACT],['SWIFT',d.SWIFT]].filter(r=>r[1]);
else rows=[['IFSC Code',v],['Bank',BK[v.slice(0,4)]||'Bank code '+v.slice(0,4)],['Bank code',v.slice(0,4)],['Branch code',v.slice(5)]];
const sv=on?['NEFT','RTGS','IMPS','UPI'].map(k=>'<span style="display:inline-block;margin:6px 6px 0 0;padding:3px 10px;border-radius:12px;font-size:.78rem;background:'+(d[k]?'var(--pl);color:var(--pr)':'var(--bg);color:var(--mu);text-decoration:line-through')+'">'+k+'</span>').join(''):'';
let rc=[];try{rc=JSON.parse(localStorage.getItem('ih')||'[]')}catch(e){}if(on)rc=[v,...rc.filter(x=>x!=v)].slice(0,5);try{localStorage.setItem('ih',JSON.stringify(rc))}catch(e){}
$('out').innerHTML='<h3 style="margin:0 0 8px">Bank Details</h3>'+rows.map(r=>'<div class="rw"><span style="color:var(--mu)">'+r[0]+'</span><b style="max-width:65%">'+IE(r[1])+'</b></div>').join('')+sv+(on?'':'<div class="note">⚠️ Branch, address, city, district and state need a live bank database. This preview page is not allowed to reach one, so only the bank and branch code are decoded. Download the file and open it from your own site or device to see full details.</div><div class="act"><a href="https://ifsc.razorpay.com/'+v+'" target="_blank" rel="noopener" style="flex:1;text-align:center;border:1px solid var(--pr);color:var(--pr);border-radius:8px;padding:8px;text-decoration:none">View full details ↗</a></div><textarea id="pj" rows="3" style="'+IS+'" placeholder="Open the link, copy the text shown and paste it here to format it"></textarea><div class="act"><button id="pjb">Format pasted details</button></div>')+'<div class="act"><button id="ccp">Copy details</button><a href="'+GL('IFSC '+v+' branch address')+'" target="_blank" rel="noopener" style="flex:1;text-align:center;border:1px solid var(--pr);color:var(--pr);border-radius:8px;padding:8px;text-decoration:none">Web search ↗</a></div>'+(rc.length?'<div class="note">Recent: '+rc.map(x=>'<a href="#" data-r="'+x+'">'+x+'</a>').join(' · ')+'</div>':'');
$('ccp').onclick=e=>(navigator.clipboard?navigator.clipboard.writeText(rows.map(r=>r[0]+': '+r[1]).join('\n')):Promise.reject()).then(()=>e.target.textContent='Copied ✓',()=>e.target.textContent='Copy not allowed')}
document.addEventListener('click',e=>{const x=e.target.dataset&&e.target.dataset.r;if(x){e.preventDefault();$('ic').value=x;ifscGo(x)}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='ic'&&$('is'))$('is').click()});
document.addEventListener('input',e=>{if(e.target.id=='ic')e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'')});
function bulkRows(t){const s=[...new Set(t.toUpperCase().split(/[\s,;]+/).filter(Boolean))].slice(0,200);return s.map(c=>{const ok=/^[A-Z]{4}0[A-Z0-9]{6}$/.test(c);return[c,ok,ok?(BK[c.slice(0,4)]||'Unlisted bank code'):'Invalid format',ok?c.slice(5):'-']})}
function bulkUI(){$('ib1').className='chip';$('ib2').className='chip';
$('ia').innerHTML='<label>IFSC codes (one per line or comma-separated, max 200)</label><textarea id="bt" rows="5" style="'+IS+'" placeholder="SBIN0001234, HDFC0000001"></textarea><div class="act"><button id="bv" style="background:var(--pr);color:#fff">Validate all</button></div>';
$('out').innerHTML='<div id="br"><div class="empty">Paste codes and press Validate all.</div></div><h3 style="margin:16px 0 6px">Bank code directory</h3><input id="bq" placeholder="Search bank or code" style="'+IS+'"><div class="tw"><table id="bd"></table></div>';
const dir=q=>{q=q.toLowerCase();$('bd').innerHTML='<tr><th>Code</th><th>Bank</th></tr>'+Object.keys(BK).filter(k=>(k+BK[k]).toLowerCase().includes(q)).map(k=>'<tr><td>'+k+'</td><td style="text-align:left">'+BK[k]+'</td></tr>').join('')};dir('');$('bq').oninput=e=>dir(e.target.value);
$('bv').onclick=()=>{const r=bulkRows($('bt').value);if(!r.length){$('br').innerHTML='<div class="empty">Enter at least one code.</div>';return}const g=r.filter(x=>x[1]).length;$('br').innerHTML='<div class="big"><small>Valid format</small><b>'+g+' / '+r.length+'</b></div><div class="tw"><table><tr><th>IFSC</th><th>Status</th><th>Bank</th><th>Branch code</th></tr>'+r.map(x=>'<tr><td>'+x[0].replace(/[<>&"]/g,'')+'</td><td>'+(x[1]?'✅':'❌')+'</td><td>'+x[2]+'</td><td>'+x[3]+'</td></tr>').join('')+'</table></div><div class="act"><button id="bc">Copy as CSV</button></div>';
$('bc').onclick=e=>(navigator.clipboard?navigator.clipboard.writeText('IFSC,Valid,Bank,BranchCode\n'+r.map(x=>x[0]+','+x[1]+',"'+x[2]+'",'+x[3]).join('\n')):Promise.reject()).then(()=>e.target.textContent='Copied ✓',()=>e.target.textContent='Copy not allowed')}}
document.addEventListener('click',e=>{if(e.target.id=='pjb'){const t=$('pj');try{const d=JSON.parse(t.value);if(!d.BRANCH)throw 0;const v=/^[A-Z]{4}0[A-Z0-9]{6}$/.test(d.IFSC||'')?d.IFSC:$('ic').value.trim().toUpperCase();ifscGo(v,d)}catch(x){t.style.borderColor='red';t.placeholder='Could not read that text. Paste the full text from the link.'}}});
cats();grid();
</script></body></html>
